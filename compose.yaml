services:
  api:
    build: .
    command: uvicorn self_evolution_agent.api:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite+aiosqlite:////data/self_evolution.db
      CHROMA_PATH: /data/chroma
      VISION_BASE_URL: http://vision:8001
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: python -m self_evolution_agent.worker
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite+aiosqlite:////data/self_evolution.db
      CHROMA_PATH: /data/chroma
      VISION_BASE_URL: http://vision:8001
    volumes:
      - ./data:/data
    depends_on:
      api:
        condition: service_healthy
      vision:
        condition: service_started
    restart: unless-stopped

  vision:
    build:
      context: .
      dockerfile: Dockerfile.vision
    env_file: .env
    environment:
      DATA_DIR: /data
      HF_HOME: /models/huggingface
      VISION_MODEL_NAME: /models/Qwen3.5-2B
      VISION_ADAPTER_PATH: /models/qwen35-fridge-qlora
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
      - ./models:/models/huggingface
      - ./train_venv/models/Qwen3.5-2B:/models/Qwen3.5-2B:ro
      - ./outputs/qwen35-fridge-qlora:/models/qwen35-fridge-qlora:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
