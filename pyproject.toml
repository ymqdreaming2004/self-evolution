[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "self-evolution-agent"
version = "0.1.0"
description = "A Feishu-first personal agent hub built with FastAPI and LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "beautifulsoup4>=4.12,<5",
  "chromadb>=0.6,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-core>=0.3,<1",
  "langgraph>=0.4,<2",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "lark-oapi>=1.4,<3",
  "openai>=1.60,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dateutil>=2.9,<3",
  "python-multipart>=0.0.20,<1",
  "sentence-transformers>=3.3,<6",
  "sqlalchemy>=2.0,<3",
  "structlog>=24.4,<26",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
]
vision = [
  "accelerate>=1.3,<2",
  "bitsandbytes>=0.45,<1",
  "peft>=0.18,<1",
  "pillow>=11,<12",
  "qwen-vl-utils>=0.0.10,<1",
  "torch>=2.5,<3",
  "torchvision>=0.20,<1",
  "transformers>=5.8,<6",
]
train = [
  "datasets>=3.2,<5",
  "peft>=0.14,<1",
  "trl>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/self_evolution_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
